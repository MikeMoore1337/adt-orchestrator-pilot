name: Original Issue-Orchestrator namespace branch Git boundary

on:
  pull_request:
    paths:
      - 'upstream/**'
      - 'scripts/apply_orchestrator_git_ref_fix.py'
      - 'scripts/prepare_namespaced_original_engine.sh'
      - 'scripts/probe_io570_loopback_proxy.py'
      - 'scripts/probe_namespaced_codex_sandbox.py'
      - 'scripts/probe_io570_completion_transport.py'
      - 'tests/test_io570_completion_auth.py'
      - 'tests/test_io570_validation_timings.py'
      - 'tests/test_isolated_ref_git_policy.py'
      - 'tests/test_io570_codex_metadata.py'
      - 'tests/test_io570_exact_lease_push.py'
      - 'tests/test_io570_stage2_scope.py'
      - '.github/workflows/io570-isolated-git-refs.yml'

permissions:
  contents: read

jobs:
  original-source-git:
    name: Original upstream Git ref directory confinement
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Fetch original immutable Issue-Orchestrator source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/io570-upstream"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/issue-orchestrator/issue-orchestrator.git
          git -C "$root" fetch --depth=1 origin d4a79824ccd806089cf3f70ec632d39b8ee255ea
          git -C "$root" checkout -q --detach FETCH_HEAD
          python3 scripts/apply_orchestrator_git_ref_fix.py "$root"
          python3 scripts/apply_orchestrator_git_ref_fix.py "$root" --apply
          sandbox="src/issue_orchestrator/execution/agent_runner_providers/sandbox.py"
          test "$(git -C "$root" hash-object "$sandbox")" = "fca26cf3e6e88b984e2758005f3ce9e5019838ab"
          patch_file="$GITHUB_WORKSPACE/upstream/issue-orchestrator-0.10.0-io570-loopback-proxy.patch"
          git -C "$root" apply --check "$patch_file"
          git -C "$root" apply "$patch_file"
          timings="src/issue_orchestrator/infra/validation_timings.py"
          test "$(git -C "$root" hash-object "$timings")" = "45c63ee3269ea343f297f07a62b0fb25164448d8"
          timing_patch="$GITHUB_WORKSPACE/upstream/issue-orchestrator-0.10.0-io570-validation-timings.patch"
          git -C "$root" apply --check "$timing_patch"
          git -C "$root" apply "$timing_patch"
          session_env="src/issue_orchestrator/control/session_env.py"
          callback="src/issue_orchestrator/entrypoints/cli_tools/agent_callback.py"
          test "$(git -C "$root" hash-object "$session_env")" = "041d27bc3947a66095a03b9aa7e6dbc3d0787538"
          test "$(git -C "$root" hash-object "$callback")" = "36948fc6865db372da8712a1c421dd350e92ddcf"
          cb_patch="$GITHUB_WORKSPACE/upstream/issue-orchestrator-0.10.0-io570-callback-env.patch"
          git -C "$root" apply --check "$cb_patch"
          git -C "$root" apply "$cb_patch"
          metadata_patch="$GITHUB_WORKSPACE/upstream/issue-orchestrator-0.10.0-io570-codex-metadata-detached.patch"
          git -C "$root" apply --check "$metadata_patch"
          git -C "$root" apply "$metadata_patch"
          lease_patch="$GITHUB_WORKSPACE/upstream/issue-orchestrator-0.10.0-io570-exact-lease-push.patch"
          test "$(git -C "$root" hash-object src/issue_orchestrator/execution/git_push_operations.py)" = "6317043ccec85ab07a883e4eb0f41126a33a3cc8"
          test "$(git -C "$root" hash-object src/issue_orchestrator/execution/git_working_copy.py)" = "4804e1c7f62eb45158f909296bdb4f7e3ad201b0"
          git -C "$root" apply --check "$lease_patch"
          git -C "$root" apply "$lease_patch"
          python3 -m py_compile "$root/src/issue_orchestrator/execution/git_push_operations.py" "$root/src/issue_orchestrator/execution/git_working_copy.py"
          git -C "$root" diff --check
          expected="$(printf 'src/issue_orchestrator/adapters/worktree/_worktree.py\nsrc/issue_orchestrator/control/session_env.py\nsrc/issue_orchestrator/domain/branch_naming.py\nsrc/issue_orchestrator/entrypoints/cli_tools/agent_callback.py\nsrc/issue_orchestrator/execution/agent_runner_providers/git_worktree_access.py\nsrc/issue_orchestrator/execution/agent_runner_providers/sandbox.py\nsrc/issue_orchestrator/execution/git_push_operations.py\nsrc/issue_orchestrator/execution/git_working_copy.py\nsrc/issue_orchestrator/infra/validation_timings.py')"
          test "$(git -C "$root" diff --name-only)" = "$expected"
          echo "PINNED_ORIGINAL_ENGINE_PATCH=PASS"
      - name: Offline Git add and commit with shared refs read-only
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/io570-upstream"
          python3 -m venv "${RUNNER_TEMP}/io570-venv"
          "${RUNNER_TEMP}/io570-venv/bin/python" -m pip install -q --disable-pip-version-check "$root"
          export ISSUE_ORCHESTRATOR_ISOLATED_GIT_REF_DIRS=1
          export IO570_PATCHED_ORCHESTRATOR_SOURCE="$root"
          export PYTHONPATH="$root/src"
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_isolated_ref_git_policy.py -v
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_io570_codex_metadata.py -v
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_io570_loopback_policy.py -v
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_io570_validation_timings.py -v
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_io570_completion_auth.py -v
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_io570_exact_lease_push.py -v
          "${RUNNER_TEMP}/io570-venv/bin/python" -m unittest discover \
            -s tests -p test_io570_stage2_scope.py -v
          echo "ORIGINAL_ENGINE_NAMESPACED_GIT_DAC=PASS"
