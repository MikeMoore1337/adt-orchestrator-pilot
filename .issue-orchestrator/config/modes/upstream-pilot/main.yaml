# STAGE-2 SOURCE ONLY; requires separate owner activation AFTER merged CI and host probes.
# Owner authorizes Codex CLI via ChatGPT, NOT API-key billing.
# Original issue-orchestrator v0.10.0, pinned d4a79824ccd806089cf3f70ec632d39b8ee255ea
# Select explicitly via --mode upstream-pilot after the scoped pilot runtime preflight.
repo:
  name: MikeMoore1337/adt-orchestrator-pilot

worktrees:
  base: "../adt-orchestrator-pilot-worktrees"
  base_branch_override: main
  # Seed exclusively from protected origin/main after this Stage-2 PR is human merged.
  # Never select an unmerged or draft PR commit.
  seed_ref: origin/main

agents:
  "agent:dev":
    prompt: ".issue-orchestrator/prompts/dev.md"
    provider: codex
    ai_system: codex
    sandbox: true
    reviewer: "agent:reviewer"
    # Small synthetic pilot: fail promptly if a coding session stalls.
    timeout_minutes: 15
    provider_args:
      execution_mode: exec
      approval_mode: default
      sandbox: workspace-write
  "agent:reviewer":
    prompt: ".issue-orchestrator/prompts/reviewer.md"
    provider: codex
    ai_system: codex
    sandbox: true
    timeout_minutes: 10
    provider_args:
      approval_mode: default
      sandbox: workspace-write

execution:
  concurrency:
    max_concurrent_sessions: 1
    session_timeout_minutes: 20
  terminal_adapter: subprocess

review:
  enabled: true
  default: "agent:reviewer"
  max_rework_cycles: 2
  internal:
    enabled: false

validation:
  quick:
    cmd: "python -m unittest discover -s tests -v"
    timeout_seconds: 300
  publish:
    cmd: "python -m unittest discover -s tests -v"
    timeout_seconds: 900
    dirty_check: tracked

# This disposable pilot must not spend another model turn after a missing
# completion record without an operator examining the first attempt.
retry:
  interrupted_sessions:
    enabled: false

filtering:
  label: "adt-io570-stage2-20261114"
  exclude_labels: ["HOLD", "blocked"]
  # Disposable synthetic repository only: one-shot launcher admits only open #20/#21.
  # WIP=1 and Depends-on: #20 enforce order, with human merge between issues.
  # No single-issue override: retain one continuous original-engine queue.
  max_to_start: 2

tech_lead:
  enabled: false
goal_pilot:
  enabled: false
merge_queue:
  enabled: false
e2e:
  enabled: false
