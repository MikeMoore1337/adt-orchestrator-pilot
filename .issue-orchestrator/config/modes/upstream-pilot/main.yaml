# SOURCE ONLY. Do NOT activate until host security, subscription login and issue-scope preflight pass.
# Owner authorizes Codex CLI via ChatGPT, NOT API-key billing.
# Original issue-orchestrator v0.10.0, pinned d4a79824ccd806089cf3f70ec632d39b8ee255ea
# Select explicitly via --mode upstream-pilot after the scoped pilot runtime preflight.
repo:
  name: MikeMoore1337/adt-orchestrator-pilot

worktrees:
  base: "../adt-orchestrator-pilot-worktrees"
  base_branch_override: main
  # Seed from protected main. Do not start the engine until this preparation
  # PR is human-merged: the agent prompts must exist on origin/main.
  seed_ref: origin/main

agents:
  "agent:dev":
    prompt: ".issue-orchestrator/prompts/dev.md"
    provider: codex
    ai_system: codex
    sandbox: true
    reviewer: "agent:reviewer"
    # Small synthetic pilot: fail promptly if a coding session stalls.
    timeout_minutes: 15
    provider_args:
      approval_mode: default
      sandbox: workspace-write
  "agent:reviewer":
    prompt: ".issue-orchestrator/prompts/reviewer.md"
    provider: codex
    ai_system: codex
    sandbox: true
    timeout_minutes: 10
    provider_args:
      approval_mode: default
      sandbox: workspace-write

execution:
  concurrency:
    max_concurrent_sessions: 1
    session_timeout_minutes: 20
  terminal_adapter: subprocess

review:
  enabled: true
  default: "agent:reviewer"
  max_rework_cycles: 2
  internal:
    enabled: false

validation:
  quick:
    cmd: "python -m unittest discover -s tests -v"
    timeout_seconds: 300
  publish:
    cmd: "python -m unittest discover -s tests -v"
    timeout_seconds: 900
    dirty_check: tracked

filtering:
  label: "adt-io570-pilot-20261109"
  exclude_labels: ["HOLD", "blocked"]
  # Synthetic repository only: exclusive, owner-controlled label admits #7/#8.
  # WIP=1 and Depends-on: #7 ensure #8 cannot start before #7 is closed.
  # No single-issue override: retain one continuous original-engine queue.
  max_to_start: 2

tech_lead:
  enabled: false
goal_pilot:
  enabled: false
merge_queue:
  enabled: false
e2e:
  enabled: false
